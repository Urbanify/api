# Staging (demo) on Render's free plan. Production will run elsewhere.
# The free instance sleeps after 15 min idle and takes ~1 min to wake up.
services:
  - type: web
    name: urbanify-api-stg
    runtime: node
    plan: free
    region: virginia
    branch: stg
    buildCommand: npm ci && npm run build && npx prisma migrate deploy && npx prisma db seed
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      # Paste both from Supabase > Connect: DATABASE_URL is the transaction pooler (port 6543,
      # add ?pgbouncer=true), DIRECT_URL is the session pooler (port 5432).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        generateValue: true
      # Resend API key for outgoing email. If left empty, emails are skipped with a warning in the logs.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_SERVICE_FROM
        value: Urbanify <noreply@urbanify.com.br>
      - key: FRONTEND_URL
        value: https://stg.urbanify.com.br/update-password
      # Apps Script web app URL that appends leads to the internal sheet. If left empty, rows are skipped.
      - key: SHEETS_WEBHOOK_URL
        sync: false
      # Login of the store reviewers: this email signs in with the fixed code, without sending mail.
      # The code is in apps/mobile/fastlane/metadata/review_information/demo_password.txt (not in Git).
      - key: REVIEW_EMAIL
        value: revisao@urbanify.com.br
      - key: REVIEW_CODE
        sync: false
      # Expo access token for push notifications. Optional: sends work without it.
      - key: EXPO_ACCESS_TOKEN
        sync: false
